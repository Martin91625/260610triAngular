<div class="container mt-3"> 
  <form
    [formGroup]="triangleForm"
    (ngSubmit)="onSubmit()"
  >
    <div>
      <h1>Háromszög</h1>
      <label
        for="base"
        class="form-label"
      >Alap</label>
      <input
        type="text"
        id="base"
        formControlName="base"
        class="form-control"
      >
  
      <label
        for="height"
        class="form-label"
      >Magasság</label>
      <input
        type="text"
        id="height"
        formControlName="height"
        class="form-control"
      >
  
      <button
        type="submit"
        class="btn btn-primary"
      >Számít</button>
      <br>
      <label
        for="area"
        class="form-label"
      >Terület</label>
      <input
        type="text"
        id="area"
        formControlName="area"
        class="form-control"
      >
    </div>
  </form>
</div>
